<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الحضور - مستر يسر الموافي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-white text-gray-800 p-8 rounded-2xl shadow-2xl w-full max-w-md text-center space-y-4">
        <h2 class="text-2xl font-bold text-blue-600">تسجيل الحضور الفوري</h2>
        <p class="text-sm text-gray-500">مستر يسر الموافي - المرحلة الثانوية</p>

        <div id="status-box" class="p-4 rounded-xl bg-gray-100 text-gray-700 font-bold">
            جاري قراءة كود الطالب وتسجيل الحضور...
        </div>

        <div class="pt-4 border-t">
            <a href="index.html" id="admin-link" class="text-xs text-blue-500 underline hidden">الانتقال للوحة التحكم الرئيسية</a>
        </div>
    </div>

    <script>
        // قراءة الكود مباشرة وبأبسط طريقة ممكنة
        const urlParams = new URLSearchParams(window.location.search);
        let studentName = urlParams.get('name');
        let studentCode = urlParams.get('code');

        const box = document.getElementById('status-box');

        if (studentName && studentCode) {
            studentName = decodeURIComponent(studentName);
            
            // حفظ الحضور في الذاكرة المشتركة للمتصفح
            let attendance = JSON.parse(localStorage.getItem('attendance_log')) || [];
            
            // التأكد عدم التكرار لنفس اليوم
            const today = new Date().toLocaleDateString('ar-EG');
            const alreadyExists = attendance.some(a => a.code === studentCode && a.date.includes(today));

            if (!alreadyExists) {
                attendance.unshift({
                    name: studentName,
                    code: studentCode,
                    date: new Date().toLocaleString('ar-EG'),
                    status: 'حاضر'
                });
                localStorage.setItem('attendance_log', JSON.stringify(attendance));
            }

            box.className = "p-4 rounded-xl bg-green-100 text-green-800 font-bold space-y-2";
            box.innerHTML = `
                <div class="text-lg">✅ تم تسجيل حضورك بنجاح!</div>
                <div class="text-sm text-gray-700">أهلاً بك يا <b>${studentName}</b></div>
                <div class="text-xs text-gray-500">الكود: ${studentCode}</div>
            `;
        } else {
            // لو مفيش بيانات في الابط، افتح لوحة التحكم أو وجهه
            box.className = "p-4 rounded-xl bg-blue-50 text-blue-800 font-bold";
            box.innerHTML = `
                <div>مرحباً بك في لوحة تحكم مستر يسر الموافي</div>
                <input type="password" id="admin-pass" placeholder="كلمة المرور للتحكم" class="mt-3 w-full p-2 border rounded text-center text-sm text-black">
                <button onclick="checkAdmin()" class="mt-2 w-full bg-blue-600 text-white py-2 rounded text-sm">دخول لوحة التحكم</button>
            `;
            document.getElementById('admin-link').classList.remove('hidden');
        }

        function checkAdmin() {
            const pass = document.getElementById('admin-pass').value;
            if (pass === "23122002YY") {
                // عرض شاشة الإدارة البسيطة مباشرة
                document.body.innerHTML = `
                    <div class="p-6 max-w-2xl mx-auto w-full bg-white text-gray-900 rounded-xl shadow-xl mt-10">
                        <h2 class="text-xl font-bold text-blue-600 mb-4">لوحة تحكم الحضور - مستر يسر الموافي</h2>
                        <div class="mb-4">
                            <h3 class="font-bold text-sm text-gray-700 mb-2">سجلات الحضور المسجلة:</h3>
                            <div id="log-list" class="space-y-2 max-h-60 overflow-y-auto border p-2 rounded bg-gray-50 text-xs"></div>
                        </div>
                        <div class="space-y-2 border-t pt-4">
                            <h3 class="font-bold text-sm text-gray-700">توليد رابط طالب جديد للـ QR:</h3>
                            <input type="text" id="p-name" placeholder="اسم الطالب" class="w-full p-2 border rounded">
                            <input type="text" id="p-code" placeholder="الرقم التعريفي (مثال: 101)" class="w-full p-2 border rounded">
                            <button onclick="generateLink()" class="w-full bg-green-600 text-white py-2 rounded font-bold">إنشاء رابط وطباعة الـ QR</button>
                            <div id="result-link-box" class="mt-2 text-xs font-mono break-all text-blue-600"></div>
                        </div>
                    </div>
                `;
                renderLogs();
            } else {
                alert("كلمة المرور غير صحيحة");
            }
        }

        function renderLogs() {
            let attendance = JSON.parse(localStorage.getItem('attendance_log')) || [];
            const list = document.getElementById('log-list');
            list.innerHTML = attendance.length ? '' : 'لا توجد سجلات حضور حتى الآن.';
            attendance.forEach(a => {
                list.innerHTML += `<div class="p-2 bg-white border rounded flex justify-between"><span><b>${a.name}</b> (${a.code})</span><span class="text-gray-500">${a.date}</span></div>`;
            });
        }

        function generateLink() {
            const name = document.getElementById('p-name').value;
            const code = document.getElementById('p-code').value;
            if(!name || !code) { alert('أدخل الاسم والكود'); return; }

            const baseUrl = window.location.origin + window.location.pathname;
            const finalUrl = `${baseUrl}?name=${encodeURIComponent(name)}&code=${encodeURIComponent(code)}`;
            
            document.getElementById('result-link-box').innerHTML = `
                رابط الطالب (استخدمه لتوليد الـ QR): <br>
                <a href="${finalUrl}" target="_blank" class="text-blue-700 underline">${finalUrl}</a>
            `;
        }
    </script>
</body>
</html>
